<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E4A2C">
<title>Magazzino – La Spesa Sfusa</title>
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <button class="icon-btn" data-act="back" id="backBtn" hidden aria-label="Indietro">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <h1 id="viewTitle">Magazzino</h1>
  <button class="icon-btn" data-act="camera" aria-label="Scansiona con la fotocamera" id="camBtn">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M7 9v6M10 9v6M13 9v6M16 9v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <a class="icon-btn" href="#impostazioni" aria-label="Impostazioni">

<main id="view" tabindex="-1"></main>

  <a href="#home" data-tab="home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    <span>Home</span>
  </a>
  <a href="#carico" data-tab="carico">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    <span>Arrivi</span>
  </a>
  <a href="#scadenze" data-tab="scadenze">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4M12 13v3l2 1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

  <a href="#ordini" data-tab="ordini">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2l2 11h10l2-8H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="9" cy="19.5" r="1.5" fill="currentColor"/><circle cx="17" cy="19.5" r="1.5" fill="currentColor"/></svg>

  </a>
  <a href="#catalogo" data-tab="catalogo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z M9 9h7M9 13h7M9 17h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <span>Catalogo</span>
  </a>
</nav>

<dialog id="modal"><div id="modalBody"></div></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="fileInput" accept="application/json,.json" hidden>

<script src="app.js"></script>

</html>
